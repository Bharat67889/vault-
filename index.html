  <!-- ⚙️ UNCRASHABLE ENGINE SCRIPT -->
  <script>
    // Primary Main Queue Sheet
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTPRJK4L_CRzANOtau2Om8jm9gr_jXUH-NPxOqwmbmCTocaXkKkUoXxiStEw3GWJ_MpwpoNjFxBGGao/pub?gid=805147059&single=true&output=csv";
    
    // Tele User Map Tab
    const TELE_USER_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTPRJK4L_CRzANOtau2Om8jm9gr_jXUH-NPxOqwmbmCTocaXkKkUoXxiStEw3GWJ_MpwpoNjFxBGGao/pub?gid=1266746265&single=true&output=csv";
    
    const SMARTLINK_URL = "https://www.profitableratecpmnetwork.com/jwdwh4yz?key=587e81aea49c6c24586e3f04326a297d";

    let db = [];
    let currentModel = null;
    let observer = null;
    let cardsRenderedCount = 0;

    function cleanLines(text) {
      if (!text) return [];
      return text.replace(/\r/g, '').trim().split("\n").map(l => 
        l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^["']|["']$/g, '').trim())
      );
    }

    function extractTargetId() {
      const params = new URLSearchParams(window.location.search);
      let target = params.get('id');
      if (!target) {
        const match = window.location.href.match(/[?&]id=([^&#]+)/);
        if (match) target = match[1];
      }
      return target ? decodeURIComponent(target).trim() : null;
    }

    async function initVault() {
      try {
        // Step 1: Safe Fetch Tele User Map
        const teleMap = {};
        try {
          const tRes = await fetch(TELE_USER_URL + "&cb=" + Date.now());
          if (tRes.ok) {
            const tText = await tRes.text();
            const tRows = cleanLines(tText);
            for (let i = 1; i < tRows.length; i++) {
              const pNo = parseInt(tRows[i][0]);
              const uName = (tRows[i][1] || "").toLowerCase().trim();
              if (!isNaN(pNo) && uName) {
                teleMap[uName] = pNo;
              }
            }
          }
        } catch (te) {
          console.warn("Tele User map fetch skipped, using queue fallback");
        }

        // Step 2: Main Queue Fetch
        const qRes = await fetch(CSV_URL + "&cb=" + Date.now());
        const qText = await qRes.text();
        const qRows = cleanLines(qText);

        db = [];
        for (let i = 1; i < qRows.length; i++) {
          const row = qRows[i];
          const shortcode = row[0];
          const username = row[1] || "creator";
          const status = (row[2] || "").trim().toUpperCase();

          if (shortcode && shortcode.length > 3) {
            const cleanUser = username.toLowerCase().trim();
            const colD = parseInt(row[3]);

            // Exact sync from tele user -> Column D -> Row Index
            let finalPost = teleMap[cleanUser];
            if (!finalPost || isNaN(finalPost)) {
              finalPost = (!isNaN(colD) && colD > 0) ? colD : i;
            }

            db.push({
              shortcode: shortcode,
              username: username,
              status: status,
              postIndex: finalPost
            });
          }
        }

        if (db.length === 0) throw new Error("Empty DB");

        const targetId = extractTargetId();
        loadActiveModel(targetId, false);
        refreshGrid(8);
        setupIntersectionObserver();

      } catch (err) {
        console.error("Critical Load Error:", err);
        // Fallback: Show loader error only if queue sheet actually failed
        document.getElementById('loader').innerHTML = `<p class="text-pink-500 text-xs font-bold">Connecting to Vault...</p>`;
        setTimeout(initVault, 2500); // Auto-retry
      }
    }

    function loadActiveModel(query, triggerRefresh = true) {
      if (!db || db.length === 0) return;

      if (!query) {
        // Highest post number = latest uploaded model
        const sorted = [...db].sort((a, b) => a.postIndex - b.postIndex);
        currentModel = sorted[sorted.length - 1];
      } else {
        const cleanQuery = String(query).trim();
        const numericId = parseInt(cleanQuery);

        let match = null;

        // 1. Direct exact Post Index match
        if (!isNaN(numericId) && numericId > 0) {
          match = db.find(m => m.postIndex === numericId);
        }

        // 2. Fallback Username match
        if (!match) {
          match = db.find(m => m.username.toLowerCase() === cleanQuery.toLowerCase());
        }

        // 3. Fallback Shortcode match
        if (!match) {
          match = db.find(m => m.shortcode.toLowerCase() === cleanQuery.toLowerCase());
        }

        currentModel = match || db[db.length - 1];
      }
      
      renderHero();

      if (triggerRefresh) {
        refreshGrid(8);
      }
    }

    function renderHero() {
      const loader = document.getElementById('loader');
      const card = document.getElementById('contentCard');
      const cardSpinner = document.getElementById('cardSpinner');
      const thumb = document.getElementById('modelThumbnail');
      const label = document.getElementById('postLabel');
      const blurredHandle = document.getElementById('blurredHandle');

      cardSpinner.classList.remove('hidden');

      label.innerText = currentModel.postIndex;
      blurredHandle.innerText = "@••••••••••";
      
      thumb.dataset.failedOnce = "";
      thumb.src = getThumbUrl(currentModel.shortcode, 'l');

      thumb.onload = () => { cardSpinner.classList.add('hidden'); };
      setTimeout(() => { cardSpinner.classList.add('hidden'); }, 1200);

      loader.classList.add('hidden');
      card.classList.remove('hidden');

      document.getElementById('unlockBtn').classList.remove('hidden');
      document.getElementById('timerContainer').classList.add('hidden');
      document.getElementById('finalProfileLink').classList.add('hidden');
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getThumbUrl(shortcode, size = 'l') {
      return `https://images.weserv.nl/?url=https://www.instagram.com/p/${shortcode}/media/?size=${size}&output=jpg&default=https://placehold.co/400x600/0f172a/ec4899?text=Vault+Model`;
    }

    function handleThumbError(img) {
      if (!img.dataset.failedOnce) {
        img.dataset.failedOnce = "true";
        img.src = `https://instagram.com/p/${currentModel.shortcode}/media/?size=l`;
      }
    }

    document.getElementById('unlockBtn').addEventListener('click', () => {
      const btn = document.getElementById('unlockBtn');
      const timerBox = document.getElementById('timerContainer');
      const pBar = document.getElementById('progressBar');
      const countdown = document.getElementById('countdownText');
      const finalLink = document.getElementById('finalProfileLink');
      const blurredHandle = document.getElementById('blurredHandle');
      const unlockedText = document.getElementById('unlockedBtnText');

      try {
        const adWindow = window.open(SMARTLINK_URL, '_blank');
        if (adWindow) adWindow.blur();
        window.focus();
      } catch(e) {}

      btn.classList.add('hidden');
      timerBox.classList.remove('hidden');

      let timeLeft = 5;
      pBar.style.width = "0%";
      
      const interval = setInterval(() => {
        timeLeft--;
        const percentage = ((5 - timeLeft) / 5) * 100;
        pBar.style.width = percentage + "%";
        countdown.innerText = timeLeft + "s";

        if (timeLeft <= 0) {
          clearInterval(interval);
          timerBox.classList.add('hidden');
          
          blurredHandle.innerText = "@" + currentModel.username;
          finalLink.href = `https://www.instagram.com/${currentModel.username}/`;
          unlockedText.innerText = `VISIT @${currentModel.username}`;
          finalLink.classList.remove('hidden');
        }
      }, 1000);
    });

    function refreshGrid(count = 8) {
      const grid = document.getElementById('exploreGrid');
      grid.innerHTML = "";
      cardsRenderedCount = 0;
      appendBatchToGrid(count);
    }

    function createInlineAdCard() {
      const adWrapper = document.createElement('div');
      adWrapper.className = "col-span-2 my-1 rounded-2xl overflow-hidden bg-slate-900/90 border border-dashed border-pink-500/30 p-2 text-center shadow-lg flex flex-col items-center justify-center min-h-[140px]";
      adWrapper.innerHTML = `
        <div class="w-full flex justify-between items-center px-2 pb-1 text-[10px] text-slate-500 font-bold uppercase tracking-wider">
          <span>Sponsored Recommendation</span>
          <span class="text-pink-400">Ad</span>
        </div>
        <a href="${SMARTLINK_URL}" target="_blank" rel="noopener" class="w-full block bg-gradient-to-r from-pink-600/20 via-rose-500/20 to-purple-600/20 hover:from-pink-600/30 hover:to-purple-600/30 border border-pink-500/40 rounded-xl p-3.5 transition group">
          <div class="flex items-center justify-center gap-2 mb-1">
            <span class="text-base">🔥</span>
            <span class="text-xs font-black text-white group-hover:text-pink-300 transition">Exclusive VIP Access Unlocked</span>
          </div>
          <p class="text-[10px] text-slate-300 font-medium">Tap to explore verified VIP creator channels & live reels</p>
        </a>
      `;
      return adWrapper;
    }

    function appendBatchToGrid(count = 6) {
      const grid = document.getElementById('exploreGrid');
      const randomized = shuffleArray(db).slice(0, count);

      randomized.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden cursor-pointer hover:border-pink-500/60 transition duration-300 flex flex-col group shadow-lg";
        card.innerHTML = `
          <div class="relative aspect-[9/13] bg-slate-950 overflow-hidden">
            <img 
              src="${getThumbUrl(item.shortcode, 'm')}" 
              class="w-full h-full object-cover group-hover:scale-105 transition duration-500"
              loading="lazy"
              onerror="this.src='https://placehold.co/400x600/0f172a/ec4899?text=Vault+Model'"
            >
            <div class="absolute top-2.5 left-2.5 bg-black/85 backdrop-blur-sm px-2.5 py-1 rounded-xl border border-pink-500/30 flex items-baseline gap-1 shadow-md">
              <span class="text-[9px] font-bold text-slate-400 uppercase">POST NO.</span>
              <span class="text-xs font-black text-pink-400">${item.postIndex}</span>
            </div>
          </div>
          <div class="p-3 bg-slate-900 flex justify-between items-center">
            <span class="text-xs font-bold text-slate-400">@••••••••</span>
            <span class="text-[10px] bg-pink-500/20 text-pink-400 font-extrabold px-2.5 py-1 rounded-md border border-pink-500/30">UNLOCK 🔒</span>
          </div>
        `;

        card.addEventListener('click', () => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
          const newUrl = window.location.pathname + '?id=' + item.postIndex;
          window.history.pushState({ id: item.postIndex }, '', newUrl);
          loadActiveModel(item.postIndex, true);
        });

        grid.appendChild(card);
        cardsRenderedCount++;

        if (cardsRenderedCount % 4 === 0) {
          grid.appendChild(createInlineAdCard());
        }
      });
    }

    function setupIntersectionObserver() {
      const sentinel = document.getElementById('scrollSentinel');
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            setTimeout(() => { appendBatchToGrid(6); }, 250);
          }
        });
      }, { rootMargin: '250px' });
      observer.observe(sentinel);
    }

    window.addEventListener('popstate', () => {
      const targetId = extractTargetId();
      loadActiveModel(targetId, true);
    });

    function handleLogoClick() {
      window.history.pushState({}, '', window.location.pathname);
      loadActiveModel(null, true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('searchInput').value.trim();
      if (val) {
        window.history.pushState({ id: val }, '', window.location.pathname + '?id=' + val);
        loadActiveModel(val, true);
      }
    });

    window.addEventListener('DOMContentLoaded', initVault);
  </script>
